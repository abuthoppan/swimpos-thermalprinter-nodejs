services:
  swimpos-thermalprinter:
    build: .
    image: swimpos-thermalprinter:latest
    container_name: swimpos-thermalprinter
    ports:
      - "3000:3000"
    restart: unless-stopped
    init: true
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:3000/ || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
